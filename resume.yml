      # In another complete shift of technologies (a greater one this time from embedded to cloud), I was brought onto a completely different project, a Level 3 ADAS system. For this, I architected, led, and wrote roughly 90% of a new pipeline (part of a necessary migration from a proprietary metadatastore) which handled validation events (disengagements, triggers, annotations) - this enabled an entirely new UI approach for event triage, leading to a much faster turnaround from issue -> new data selected for models, and easing developer analysis.
