        - Led ADAS validation pipeline migration to Delta Lake, automating artifact generation and incident triage for disengagements, driver annotations, and safety triggers.
        - Migration recognized by leadership and highlighted company-wide as a model for cross-team data engineering.
        - Rewrote drive-based route matching to leverage H3 and newer geospatial databricks functions, resulting in 60x speedup.
