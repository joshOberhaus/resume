      # The team was also responsible for first round triage, and responsible for integrating content for demos, along with carrying out vehicle tests, all which I led during critical demos.
      summary: |
        - Architected and led a greenfield validation-event pipeline for a Level 3 ADAS program, authoring ~90% of the codebase while migrating off a legacy metadata store onto a Delta Lake / Databricks lakehouse.
        - Partnered across teams to model validation events: disengagements, triggers, annotations and their artifacts; enabling a new triage UI that shortened the loop from field issue to curated training data.
        - Recognized by leadership and highlighted company-wide as a model for cross-team data engineering.
        - Re-engineered drive-based route matching with H3 indexing and Databricks geospatial functions for a 60x speedup.
        - Owned global driving performance KPIs, first-round triage and demo integration; scheduled and executed the vehicle test campaign for critical customer demos.

    - name: Robert Bosch LLC
      position: "Technical Expert / Sr. SW Engineer - Perception | Tracking"
      startDate: Sep 2018
      endDate: Jun 2025
      # In a complete tech shift (from where I had no tracking, nor linear algebra knowledge) I went from joining a platform Tracking team to leading it within two years, my first task was to implement a single object tracking KPI tool, and integrate it into CI. I then went on to make individual contributions to a strategic acquisition, which we ended up securing, and from that, led that team, where I enabled them by pushing a transition from MATLAB to FoxGlove tooling, greatly speeding up simulation, and architecting a python based framework that supported more sensor configurations, more metrics, and feature driven KPI tests.
      summary: |
        - Delivered the platform's first single-object tracking KPI tool and integrated it into CI for automated, repeatable evaluation.
        - Drove key contributions that secured a strategic acquisition, realizing tracking gains from architectural changes for a 5-radar / 1-video sensor configuration, and led the team formed to deliver it.
        - Designed next-generation multi-object tracking KPI framework supporting more sensors, metrics, and feature-driven tests.
        - Acted as a force multiplier by aggressively resolving team pain points - migrating tooling from MATLAB to Foxglove and profiling out unnecessary debug-variable writes for a 6x simulation speedup.
        - Improved corner-radar tracking by addressing front-facing radar assumptions and making object-type classification sensor-mounting agnostic, reducing missed-target scenarios; optimized perception for a new radar generation.
        - Developed MATLAB-based tracking-visualization features, including Kalman-filter component projection and automation.
        - Stepped in as acting Product Owner for months at a time and led critical customer demos beyond my core role.

