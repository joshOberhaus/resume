name: Build Resume PDF

on:
  push:
    paths:
      - "resume.yml"
      - "scripts/compact_certificates.py"
      - ".github/workflows/resume.yml"
  workflow_dispatch:

permissions:
  contents: write # only needed to publish the "latest" release below

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: yamlresume/yamlresume:latest
      # The image's default user can't write to the runner's _temp dir
      # (used by actions/checkout etc.), causing EACCES; force root.
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Build resume tex
        run: yamlresume build --no-pdf resume.yml

      - name: Compact certificates section
        run: python3 scripts/compact_certificates.py resume.tex

      - name: Compile PDF
        run: xelatex -halt-on-error resume.tex

      # xelatex prints the final page count on its own ("Output written on
      # ...(N pages)"), so no extra tooling (e.g. poppler) is needed here.
      - name: Enforce single-page resume
        run: |
          pages=$(grep -oP '(?<=\()\d+(?= pages?\))' resume.log | tail -1)
          echo "Page count: $pages"
          if [ "$pages" != "1" ]; then
            echo "::error::resume.pdf is $pages pages; it must stay 1 page."
            exit 1
          fi

      - name: Rename output
        run: mv resume.pdf JoshOberhaus.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: JoshOberhaus.pdf
          retention-days: 90

      # Gives external sites a stable link to the newest build
      # (https://github.com/joshOberhaus/resume/releases/download/latest/JoshOberhaus.pdf)
      # without committing generated binaries into git history.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: JoshOberhaus.pdf
